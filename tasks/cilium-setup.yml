---
- name: Check current cilium-cli version.
  ansible.builtin.command: /usr/local/bin/cilium version --client
  register: cilium_cli_current
  changed_when: false
  failed_when: false

- name: Set cilium-cli version changed fact.
  ansible.builtin.set_fact:
    cilium_cli_outdated: "{{ kubernetes_cilium_cli_version not in (cilium_cli_current.stdout | default('')) }}"

- name: Download cilium-cli.
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/{{ kubernetes_cilium_cli_version }}/cilium-linux-{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.tar.gz"
    dest: /tmp/cilium-cli.tar.gz
    mode: '0644'
  when: cilium_cli_outdated

- name: Install cilium-cli binary.
  ansible.builtin.unarchive:
    src: /tmp/cilium-cli.tar.gz
    dest: /usr/local/bin
    remote_src: true
    mode: '0755'
  when: cilium_cli_outdated

- name: Write Cilium Helm values file.
  ansible.builtin.copy:
    content: "{{ kubernetes_cilium_values | to_nice_yaml }}"
    dest: /tmp/cilium-values.yml
    mode: '0600'

- name: Compute current Cilium values checksum.
  ansible.builtin.set_fact:
    cilium_values_checksum: "{{ kubernetes_cilium_values | to_nice_yaml | hash('sha256') }}"

- name: Read stored Cilium values checksum.
  ansible.builtin.slurp:
    src: /etc/cilium-values.sha256
  register: cilium_stored_checksum_raw
  failed_when: false

- name: Set cilium config changed fact.
  ansible.builtin.set_fact:
    cilium_config_changed: >-
      {{
        cilium_stored_checksum_raw.content is not defined or
        (cilium_stored_checksum_raw.content | b64decode | trim) != cilium_values_checksum
      }}

- name: Check if Cilium is already installed.
  ansible.builtin.command: kubectl get daemonset cilium -n kube-system -o jsonpath='{.spec.template.spec.containers[0].image}'
  register: cilium_installed
  changed_when: false
  failed_when: false

- name: Set Cilium version changed fact.
  ansible.builtin.set_fact:
    cilium_version_changed: "{{ kubernetes_cilium_version not in (cilium_installed.stdout | default('')) }}"

- name: Install Cilium networking.
  ansible.builtin.command: "cilium install --version {{ kubernetes_cilium_version }} --helm-values /tmp/cilium-values.yml --wait"
  when: cilium_installed.rc != 0

- name: Store Cilium values checksum after install.
  ansible.builtin.copy:
    content: "{{ cilium_values_checksum }}"
    dest: /etc/cilium-values.sha256
    mode: '0600'
  when: cilium_installed.rc != 0

- name: Upgrade Cilium networking.
  ansible.builtin.command: "cilium upgrade --version {{ kubernetes_cilium_version }} --helm-values /tmp/cilium-values.yml --wait"
  when: cilium_installed.rc == 0 and (cilium_cli_outdated or cilium_config_changed or cilium_version_changed)

- name: Store Cilium values checksum.
  ansible.builtin.copy:
    content: "{{ cilium_values_checksum }}"
    dest: /etc/cilium-values.sha256
    mode: '0600'
  when: cilium_installed.rc == 0 and (cilium_cli_outdated or cilium_config_changed or cilium_version_changed)
